  <title>WebRadio — 网络电台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; padding: 0; width: 100%; background: #1c1c22;
      /* Zone-2 fill */
      background-color: var(--bg-base, #1c1c22);
    }

    :root {
      --app-vh: 100dvh;
      --keyboard-offset: 0px;

      /* ── Liquid Metal accent — single warm silver-blue ── */
      --a1: #4f8ef7;   /* steel blue  — overwritten by JS */
      --a2: #94b8ff;   /* light steel */
      --ag: rgba(79,142,247,.28);

      /* ── Matte surface system (no strong blur, no glow) ── */
      --glass:   rgba(255,255,255,.10);
      --glass2:  rgba(255,255,255,.16);
      --glass3:  rgba(255,255,255,.06);

      /* 0.5px hairline borders — the core of Liquid Metal */
      --stroke:  rgba(255,255,255,.18);
      --stroke2: rgba(255,255,255,.10);

      /* ── Typography tokens ── */
      --text:       #f0f0f4;
      --text-sub:   rgba(240,240,244,.78);
      --text-muted: rgba(240,240,244,.48);

      --danger:  #f05060;
      --success: #34d069;

      /* ── Border-radius: tighter, more "machined" ── */
      --r:  14px;
      --rs:  9px;
      --rx:  6px;

      /* Subtle elevation shadows — no glow rings */
      --shadow-sm: 0 1px 4px rgba(0,0,0,.3), 0 0 0 0.5px rgba(255,255,255,.08);
      --shadow-md: 0 4px 20px rgba(0,0,0,.35), 0 0 0 0.5px rgba(255,255,255,.08);
    }

    html { scroll-behavior: smooth; overflow-x: hidden; height: 100%; }

    body {
      font-family: 'DM Sans', 'Inter', -apple-system, sans-serif;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      margin: 0; padding: 0;
      width: 100%; box-sizing: border-box;
    }

    /* ───── Dynamic mesh background ───── */
    #bg-canvas {
      position: fixed; inset: 0;
      /* extend below layout viewport to cover home-indicator zone */
      bottom: calc(-1 * var(--screen-gap, env(safe-area-inset-bottom, 20px)));
      z-index: 0; pointer-events: none;
    }

    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100%;
      width: 100%; align-self: stretch;
      overflow: hidden;
    }

    /* ───── Matte surface (Liquid Metal core) ───── */
    .glass {
      background: var(--glass);
      backdrop-filter: saturate(140%) blur(12px);
      -webkit-backdrop-filter: saturate(140%) blur(12px);
      border: 0.5px solid var(--stroke);
      box-shadow: var(--shadow-sm);
    }

    .glass-card {
      background: var(--glass);
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      border: 0.5px solid var(--stroke);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    /* ───── HEADER ───── */
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(28,28,34,.82);
      backdrop-filter: saturate(130%) blur(20px);
      -webkit-backdrop-filter: saturate(130%) blur(20px);
      border-bottom: 0.5px solid var(--stroke2);
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
      padding-top: env(safe-area-inset-top, 0px);
    }
    .header-inner {
      max-width: 1360px; margin: 0 auto; width: 100%; box-sizing: border-box;
      padding: 13px 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      font-size: 14px; font-weight: 600; letter-spacing: -.2px;
      user-select: none; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      color: var(--text);
    }
    .logo-wave {
      font-size: 17px; line-height: 1;
      display: inline-flex; align-items: center;
      color: var(--a2);
    }

    /* Theme picker */
    .theme-picker { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .theme-label { font-size: 10px; font-weight: 500; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }
    .theme-swatches { display: flex; gap: 5px; }
    /* Mobile help button — hidden on desktop, shown on mobile */
    #btn-mobile-help {
      display: none;
      width: 28px; height: 28px; border-radius: 8px;
      border: 0.5px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.5);
      cursor: pointer;
      align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background-color .2s, color .2s;
    }
    #btn-mobile-help:hover { background: rgba(255,255,255,.10); color: var(--text); }
    .swatch {
      width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
      border: 1.5px solid transparent; outline: none;
      transition: transform .15s ease, border-color .15s, box-shadow .15s;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    .swatch:hover  { transform: scale(1.25); }
    .swatch.active { border-color: rgba(255,255,255,.7); transform: scale(1.1); box-shadow: 0 0 0 2px rgba(255,255,255,.15), 0 2px 8px rgba(0,0,0,.4); }

    /* ───── PLAYER BAR ───── */
    .player-bar-outer {
      max-width: 1360px; width: 100%; margin: 0 auto; padding: 0 24px; box-sizing: border-box;
    }
    .player-bar {
      padding: 12px 20px;
      background: rgba(24,24,30,.78);
      backdrop-filter: saturate(130%) blur(16px);
      -webkit-backdrop-filter: saturate(130%) blur(16px);
      border: 0.5px solid var(--stroke);
      border-top: 0.5px solid rgba(255,255,255,.08);
      border-radius: 0 0 var(--r) var(--r);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
    }

    .station-avatar {
      width: 46px; height: 46px; border-radius: var(--rs);
      background: linear-gradient(135deg, var(--a1), var(--a2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0; overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.4), 0 0 0 0.5px rgba(255,255,255,.1);
    }
    .station-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .station-info { flex: 1; min-width: 0; max-width: 280px; overflow: hidden; }
    .station-meta { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 7px; }

    .status-pill {
      font-size: 9px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
      letter-spacing: .4px; white-space: nowrap; text-transform: uppercase;
    }
    .s-idle    { background: rgba(255,255,255,.06); color: var(--text-muted); border: 0.5px solid rgba(255,255,255,.1); }
    .s-loading { background: rgba(220,180,60,.10);  color: #d4a843; border: 0.5px solid rgba(220,180,60,.18); }
    .s-playing { background: rgba(52,208,105,.10);  color: #3dd078; border: 0.5px solid rgba(52,208,105,.2); }
    .s-paused  { background: rgba(255,255,255,.06); color: var(--text-muted); border: 0.5px solid rgba(255,255,255,.1); }
    .s-error   { background: rgba(240,80,96,.10);   color: #f07080; border: 0.5px solid rgba(240,80,96,.18); }

    /* Spectrum canvas — absolute center of player bar */
    #spectrum {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      width: min(360px, 40%);
      height: 56px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0; transition: opacity .4s;
    }
    #spectrum.active { opacity: 1; }

    /* Equalizer */
    .eq { display: flex; align-items: flex-end; gap: 2px; height: 18px; opacity: 0; transition: opacity .3s; }
    .eq.active { opacity: 1; }
    .eq-bar {
      width: 2.5px; border-radius: 2px;
      background: linear-gradient(to top, var(--a1), var(--a2));
      animation: eqb .6s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(1) { height:40%; animation-duration:.5s; }
    .eq-bar:nth-child(2) { height:72%; animation-delay:.1s; animation-duration:.7s; }
    .eq-bar:nth-child(3) { height:100%; animation-delay:.15s; animation-duration:.42s; }
    .eq-bar:nth-child(4) { height:60%; animation-delay:.05s; animation-duration:.6s; }
    .eq-bar:nth-child(5) { height:82%; animation-delay:.2s; animation-duration:.55s; }
    @keyframes eqb { from { transform:scaleY(.2); } to { transform:scaleY(1); } }

    .play-spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: var(--a2);
      animation: spin .65s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Player controls ── */
    .controls {
      display: flex; align-items: center; gap: 8px;
      margin-left: auto;
    }

    /* Ghost icon button (fav, vol icon) — same size as play btn */
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 0.5px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      cursor: pointer; color: rgba(255,255,255,.55);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
      transition: background-color .18s, border-color .18s, transform .12s ease, color .18s;
    }
    .icon-btn:hover {
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.22);
      color: var(--text); transform: scale(1.08);
    }
    .icon-btn:active { transform: scale(.92); }
    /* Fav button — starred = warm gold */
    .icon-btn#btn-fav-cur { font-size: 20px; }
    .icon-btn#btn-fav-cur.active {
      color: #e8b84b;
      border-color: rgba(232,184,75,.3);
      background: rgba(232,184,75,.08);
    }

    /* Primary play button */
    .btn-play {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,.15);
      border: 0.5px solid rgba(255,255,255,.22); cursor: pointer; color: rgba(255,255,255,.90);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
      transition: transform .12s ease, box-shadow .18s, background-color .18s;
    }
    .btn-play:hover  { transform: scale(1.08); background: rgba(255,255,255,.22); box-shadow: 0 4px 18px rgba(0,0,0,.35); }
    .btn-play:active { transform: scale(.92); }

    /* Volume wrap */
    .volume-wrap {
      display: flex; align-items: center; gap: 6px;
      min-width: 150px;
    }
    .vol-icon { font-size: 15px; color: var(--text-muted); }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      height: 3px; border-radius: 4px; cursor: pointer; outline: none; flex: 1;
      background: linear-gradient(
        to right,
        var(--a1) var(--val,50%),
        rgba(255,255,255,.14) var(--val,50%)
      );
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #e8e8ec;
      box-shadow: 0 1px 6px rgba(0,0,0,.5), 0 0 0 0.5px rgba(0,0,0,.3);
      transition: transform .12s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.35);
    }

    /* ───── MAIN GRID ───── */
    .main {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
      gap: 20px;
      padding: 20px 24px;
      max-width: 1360px; width: 100%; margin: 0 auto;
      align-items: stretch;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* PC: pane wrappers are invisible to grid layout */
    .mobile-tab-pane { display: contents; }

    aside { display: flex; flex-direction: column; min-height: 0; }
    aside .glass-card { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

    /* ───── CARD ───── */
    .card-header {
      padding: 11px 16px;
      border-bottom: 0.5px solid var(--stroke2);
      font-size: 11px; font-weight: 600; letter-spacing: .5px;
      color: var(--text-muted); text-transform: uppercase;
      display: flex; align-items: center; justify-content: space-between;
      min-height: 48px;
    }
    .card-header-title { display: flex; align-items: center; gap: 7px; }
    .card-header-actions {
      display: flex; align-items: center; gap: 6px;
      margin-left: auto;
    }
    /* Header button */
    .btn-header {
      width: 28px; height: 28px; border-radius: 7px;
      border: 0.5px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.4);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background-color .15s, color .15s, transform .1s ease, border-color .15s;
    }
    .btn-header:hover {
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.16);
      color: var(--text); transform: scale(1.12);
    }
    .btn-header:active { transform: scale(.9); }
    .count-badge {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.1);
      border-radius: 20px;
      height: 24px; padding: 0 10px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--text-muted);
      font-weight: 500; letter-spacing: .2px; white-space: nowrap;
    }

    /* ───── FAVORITES ───── */
    #fav-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    #fav-list::-webkit-scrollbar { width: 3px; }
    .custom-input {
      width: 100%; padding: 8px 12px;
      background: rgba(255,255,255,.05);
      border: 0.5px solid rgba(255,255,255,.11);
      border-radius: 8px;
      color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color .18s, background .18s;
    }
    .custom-input:focus { border-color: var(--a1); background: rgba(255,255,255,.08); box-shadow: 0 0 0 2px rgba(79,142,247,.2); }
    .custom-input::placeholder { color: rgba(255,255,255,.25); }
    .app-version {
      text-align: center;
      font-size: 10px;
      opacity: .28;
      letter-spacing: .5px;
    }
    .btn-custom-action {
      flex: 1; padding: 7px 0; border-radius: 8px; border: 0.5px solid rgba(255,255,255,.10); cursor: pointer;
      font-size: 12px; font-weight: 500; font-family: inherit;
      background: rgba(255,255,255,.06); color: rgba(255,255,255,.75);
      transition: background-color .15s, border-color .15s;
    }
    .si-original-name {
      font-style: italic; opacity: .45;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px;
    }
    .btn-custom-action:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); }
    #fav-list::-webkit-scrollbar-track { background: transparent; }
    #fav-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.10); border-radius: 3px; }
    #fav-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.20); }

    /* drag handle — merged into btn-icon style above */

    .station-item.drag-over { background: rgba(255,255,255,.14); }
    .station-item[draggable] { transition: opacity .15s; }
    .station-item.dragging  { opacity: .35; }

    /* Divider between pinned and normal */
    .fav-sep { display: none; }
    .station-item.pinned-last {
      border-bottom: 2px solid rgba(255,255,255,.5);
    }

    .empty-state {
      padding: 48px 16px; text-align: center;
      color: var(--text-muted); font-size: 12px; line-height: 2;
    }
    .empty-state .e-icon { font-size: 32px; margin-bottom: 12px; display: block; filter: drop-shadow(0 2px 8px var(--ag)); }

    /* ───── STATION ITEM ───── */
    .station-item {
      padding: 10px 14px;
      display: flex; align-items: center; gap: 11px;
      cursor: pointer;
      transition: background-color .15s;
      border-bottom: 0.5px solid var(--stroke2);
    }
    .station-item:last-child { border-bottom: none; }
    .station-item:hover { background: rgba(255,255,255,.05); }
    .station-item.now-playing {
      background: rgba(79,142,247,.07);
      border-left: 2px solid var(--a1);
      padding-left: 12px;
    }

    .si-avatar {
      width: 34px; height: 34px; border-radius: var(--rs);
      background: linear-gradient(135deg, var(--a1), var(--a2));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,.3), 0 0 0 0.5px rgba(255,255,255,.08);
    }
    .si-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .si-body { flex: 1; min-width: 0; overflow: hidden; max-width: 100%; }
    .si-name {
      font-size: 13px; font-weight: 500; letter-spacing: -.05px;
      display: flex; align-items: center; gap: 6px;
      min-width: 0; overflow: hidden;
    }
    .si-name > span:first-child {
      white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
      min-width: 0; flex: 1;
      display: block;
    }
    /* marquee active: span overflows, parent .si-name clips */
    .si-name > span.marquee-active {
      overflow: visible;
      text-overflow: clip;
      will-change: transform;
      transition: none;
    }

    /* Player bar name */
    .station-name {
      font-weight: 600; font-size: 13px; letter-spacing: -.1px;
      white-space: nowrap; overflow: hidden;
      max-width: 100%;
    }
    .station-name > span {
      display: block;
      white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
    }
    /* marquee active: span expands, parent .station-name clips */
    .station-name > span.marquee-active {
      overflow: visible;
      text-overflow: clip;
      will-change: transform;
      transition: none;
    }
    .si-sub {
      font-size: 10px; color: var(--text-muted); margin-top: 3px;
      display: flex; align-items: center; gap: 5px; flex-wrap: nowrap;
      overflow: hidden;
    }
    .si-sub > span {
      white-space: nowrap; flex-shrink: 0;
      overflow: hidden; text-overflow: ellipsis; max-width: 120px;
    }
    .si-tag {
      background: rgba(255,255,255,.07);
      border: 0.5px solid rgba(255,255,255,.08);
      border-radius: 4px;
      padding: 1px 5px; font-size: 9px; letter-spacing: .2px;
    }

    .si-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-icon {
      width: 28px; height: 28px; border-radius: 7px;
      border: 0.5px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.38);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, background-color .15s, border-color .15s, transform .1s ease;
    }
    .btn-icon:hover {
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.14);
      color: var(--text);
      transform: scale(1.12);
    }
    .btn-icon.fav   { color: #e8b84b; }
    .btn-icon.fav:hover { color: #f0cc72; transform: scale(1.18); }
    .btn-icon.top:hover { color: var(--a2); background: rgba(255,255,255,.10); }
    .btn-icon.top.active { color: var(--a2); }
    .btn-icon.top.active:hover { color: var(--text); }
    .btn-icon.del:hover { color: #f07080; background: rgba(240,80,96,.08); border-color: rgba(240,80,96,.14); }

    /* drag handle same style as btn-icon */
    .drag-handle {
      cursor: grab;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; user-select: none;
      color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.03);
      border-radius: 7px; border: 0.5px solid rgba(255,255,255,.06);
      transition: color .15s, background-color .15s;
    }
    .drag-handle:hover  { color: var(--text); background: rgba(255,255,255,.10); }
    .drag-handle:active { cursor: grabbing; }

    /* Playing dot */
    .now-dot { display: none; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.5)} }

    /* ───── RIGHT PANEL ───── */
    .right-panel { display: flex; flex-direction: column; gap: 16px; min-height: 0; min-width: 0; overflow: hidden; }
    .right-panel .glass-card { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

    .search-wrap { position: relative; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 15px; pointer-events: none; z-index: 2;
      line-height: 1; opacity: .5;
    }
    #search-input {
      width: 100%; padding: 11px 14px 11px 40px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 0.5px solid var(--stroke);
      border-radius: var(--r);
      color: var(--text); font-family: inherit; font-size: 13px; font-weight: 400;
      outline: none; transition: all .18s; position: relative; z-index: 1;
      box-shadow: var(--shadow-sm);
    }
    #search-input:focus {
      background: var(--glass2);
      border-color: var(--a1);
      box-shadow: 0 0 0 2px rgba(79,142,247,.2);
    }
    #search-input::placeholder { color: rgba(255,255,255,.28); }

    #results-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    #results-list::-webkit-scrollbar { width: 3px; }
    #results-list::-webkit-scrollbar-track { background: transparent; }
    #results-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.10); border-radius: 3px; }
    #results-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.20); }

    .state-block {
      padding: 52px 20px; text-align: center;
      color: var(--text-muted); font-size: 13px; line-height: 1.8;
    }
    .state-icon { font-size: 38px; margin-bottom: 14px; display: block; filter: drop-shadow(0 2px 8px var(--ag)); }
    .state-block h3 { font-size: 15px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    .loader-ring {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.08);
      border-top-color: var(--a1);
      animation: spin .65s linear infinite;
      margin: 0 auto 16px;
    }

    /* ───── KEYBOARD HINTS ───── */
    /* ── Keyboard hints: collapsed ? button, expands on hover ── */
    #kb-hints {
      position: fixed; bottom: 20px; left: 20px;
      z-index: 350; pointer-events: auto;
      display: flex; align-items: flex-end; gap: 0;
    }
    #kb-trigger {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(13,13,15,.6);
      border: 0.5px solid rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      cursor: default;
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55);
      opacity: 0.7;
      transition: opacity .2s;
      flex-shrink: 0;
      user-select: none;
    }
    #kb-hints:hover #kb-trigger { opacity: 1; }
    #kb-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      display: flex; flex-direction: column; gap: 3px;
      background: rgba(26,26,32,.92);
      border: 0.5px solid rgba(255,255,255,.15);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(16px);
      min-width: 100px;
      max-width: min(100px, calc(100vw - 48px - var(--aside-w, 0px)));
      opacity: 0; pointer-events: none;
      transform: translateY(6px);
      transition: opacity .18s, transform .18s;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
    }
    #kb-panel.visible {
      opacity: 1; pointer-events: auto;
      transform: translateY(0);
    }
    #kb-hints:hover #kb-panel {
      opacity: 1; pointer-events: auto;
      transform: translateY(0);
    }
    .kb-title {
      font-size: 9px; font-weight: 600; letter-spacing: .7px;
      color: rgba(255,255,255,.25); text-transform: uppercase;
      margin-bottom: 4px;
    }
    .kb-sep {
      height: 0.5px; background: rgba(255,255,255,.07);
      margin: 4px 0;
    }
    .kb-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: rgba(255,255,255,.75);
    }
    .kb-row span { color: rgba(255,255,255,.42); flex: 1; white-space: nowrap; }
    .kb-icons { display: flex; gap: 3px; flex-shrink: 0; width: 58px; min-width: 58px; align-items: center; overflow: hidden; }
    .kb-icon {
      width: 20px; height: 20px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      border-radius: 6px;
      font-size: 12px;
    }
    kbd {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 4px;
      background: rgba(255,255,255,.07);
      border: 0.5px solid rgba(255,255,255,.18);
      border-radius: 6px;
      font-family: 'DM Mono', 'Menlo', monospace; font-size: 10px; font-weight: 500;
      color: rgba(255,255,255,.55);
      white-space: nowrap;
    }

    /* ───── ALIAS DIALOG ───── */
    #alias-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
    }
    #alias-dialog {
      background: rgba(28,28,36,.94);
      border: 0.5px solid rgba(255,255,255,.18);
      border-radius: 16px;
      padding: 22px 24px;
      width: 320px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 56px rgba(0,0,0,.45), 0 0 0 0.5px rgba(255,255,255,.08) inset;
      display: flex; flex-direction: column; gap: 12px;
    }
    #alias-title {
      font-size: 14px; font-weight: 600; color: var(--text);
      letter-spacing: -.1px;
    }
    #alias-sub {
      font-size: 11px; color: rgba(255,255,255,.38);
      margin-top: -6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #alias-input {
      width: 100%; padding: 9px 12px; box-sizing: border-box;
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      border-radius: 10px;
      color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    #alias-input:focus { border-color: var(--a1); background: rgba(255,255,255,.09); box-shadow: 0 0 0 2px rgba(79,142,247,.2); }
    #alias-input::placeholder { color: rgba(255,255,255,.22); }
    #alias-btns { display: flex; gap: 7px; justify-content: flex-end; }
    #alias-btns button {
      padding: 7px 18px; border: none; border-radius: 9px;
      font-size: 12px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background-color .15s, transform .1s;
    }
    #alias-btns button:active { transform: scale(.96); }
    #alias-cancel  { background: rgba(255,255,255,.07); color: rgba(255,255,255,.6); border: 0.5px solid rgba(255,255,255,.1); }
    #alias-cancel:hover  { background: rgba(255,255,255,.12); }
    #alias-confirm { background: var(--a1); color: #fff; box-shadow: 0 2px 12px rgba(79,142,247,.3); }
    #alias-confirm:hover { opacity: .88; }

    /* ───── TOAST ───── */
    #toast-wrap {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 9999; pointer-events: none;
    }
    .toast {
      padding: 10px 16px; border-radius: var(--rs);
      font-size: 12px; font-weight: 500; letter-spacing: .05px;
      color: var(--text);
      background: rgba(28,28,36,.94);
      border: 0.5px solid rgba(255,255,255,.18);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-md);
      animation: t-in .2s ease, t-out .2s ease 2.8s forwards;
      pointer-events: auto; min-width: 150px; max-width: 260px;
    }
    @keyframes t-in  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    @keyframes t-out { from{opacity:1} to{opacity:0;transform:translateY(-4px)} }

    /* ───── RESPONSIVE 720px ───── */
    @media (max-width: 720px) and (min-width: 601px) {
      .main { grid-template-columns: 1fr; padding: 14px; gap: 14px; align-items: stretch; overflow: hidden; }
      .header-inner { padding: 10px 14px; }
      .player-bar-outer { padding: 0 14px; }
      .theme-label { display: none; }
      aside, aside .glass-card { flex: none; }
      #fav-list { max-height: 260px; min-height: 0; }
      #results-list { max-height: 50vh; }
    }

    /* ═══════════════════════════════════════
       MOBILE  ≤ 600px
    ═══════════════════════════════════════ */
    @media (max-width: 600px) {

      /* ── App shell ── */
      html, body {
        height: var(--app-vh, 100dvh);
        overflow: hidden;
      }

      .app {
        min-height: var(--app-vh, 100dvh);
        height: var(--app-vh, 100dvh);
        display: flex; flex-direction: column;
        overflow: hidden;
      }

      /* ── Header ── */
      header { position: relative; z-index: 200; }
      .header-inner { padding: 10px 14px; }
      .logo { font-size: 14px; }
      .theme-label { display: none; }

      /* ── Player bar outer: fixed bottom, above tab-bar ── */
      .player-bar-outer {
        position: fixed;
        bottom: calc(48px + var(--screen-gap, env(safe-area-inset-bottom, 0px)));
        left: 0; right: 0;
        padding: 0;
        z-index: 300;
      }
      .player-bar {
        border-radius: 0;
        border-left: none; border-right: none; border-bottom: none;
        padding: 10px 14px;
        gap: 10px;
        flex-wrap: nowrap;
      }
      /* Hide spectrum on mobile */
      #spectrum { display: none !important; }
      /* Compact avatar */
      .station-avatar { width: 38px; height: 38px; font-size: 18px; }
      /* Station info */
      .station-info { flex: 1; min-width: 0; max-width: none; }
      .station-name { font-size: 13px; }
      .station-meta { margin-top: 2px; }
      /* Controls: play + vol icon only */
      .controls { gap: 6px; }
      /* Hide volume slider on mobile (use popover) */
      #volume { display: none; }
      /* Vol icon becomes tap target */
      #vol-icon { cursor: pointer; }

      /* ── Volume popover ── */
      #vol-popover {
        position: fixed;
        bottom: calc(48px + var(--screen-gap, env(safe-area-inset-bottom, 0px)) + 64px + 8px);
        right: 14px;
        width: 44px;
        background: rgba(26,26,32,.94);
        border: 0.5px solid rgba(255,255,255,.16);
        border-radius: 14px;
        padding: 12px 0;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        z-index: 400;
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow-md);
        transition: opacity .18s, transform .18s;
      }
      #vol-popover.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }
      #vol-popover-label { font-size: 10px; color: rgba(255,255,255,.5); }
      #vol-slider-v {
        writing-mode: vertical-lr;
        direction: rtl;
        -webkit-appearance: slider-vertical;
        appearance: slider-vertical;
        width: 4px; height: 100px;
        cursor: pointer;
        accent-color: var(--a2);
      }

      /* ── Main area: flex:1, no grid ── */
      .main {
        display: flex !important;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 0 !important;
        gap: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        /* leave room for tab-bar (56px + safe-area) + player-bar (~64px) */
        padding-bottom: calc(48px + var(--screen-gap, env(safe-area-inset-bottom, 0px)) + 64px) !important;
        box-sizing: border-box;
      }

      /* ── Tab panes ── */
      .mobile-tab-pane {
        flex: 1; min-height: 0;
        display: flex !important; flex-direction: column;
        width: 100%; box-sizing: border-box;
      }
      .mobile-tab-pane.hidden { display: none !important; }

      /* Aside & right-panel: fill pane */
      aside, .right-panel {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column;
        width: 100%; box-sizing: border-box;
        gap: 0 !important;
      }
      aside .glass-card, .right-panel .glass-card {
        flex: 1; min-height: 0;
        border-radius: 0;
        border-left: none; border-right: none; border-bottom: none;
        width: 100%; box-sizing: border-box;
      }
      #fav-list { flex: 1; min-height: 0; overflow-y: auto; max-height: none; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      #results-list { flex: 1; min-height: 0; overflow-y: auto; max-height: none; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

      /* Search wrap: full width, no rounded border, thick borders for separation */
      .search-wrap {
        border-radius: 0 !important;
        border-left: none !important; border-right: none !important;
        position: sticky; top: 0; z-index: 10;
        width: 100%; box-sizing: border-box;
        margin: 0 !important;
        padding: 0 !important;
        border-top: 2px solid rgba(255,255,255,.18) !important;
        border-bottom: 2px solid rgba(255,255,255,.18) !important;
      }
      .search-wrap input { width: 100%; box-sizing: border-box; }
      /* Search input: symmetric, tighter padding, no border (wrap handles it) */
      #search-input {
        padding-top: 10px !important;
        padding-bottom: 10px !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }

      /* Card header on mobile: compact padding, unified height */
      .card-header {
        padding: 10px 12px !important;
        min-height: 52px;
      }

      /* ── Station items: taller touch targets ── */
      .station-item {
        min-height: 60px;
        padding: 8px 10px;
        width: 100%; box-sizing: border-box;
        overflow: hidden;
      }
      .si-body { min-width: 0; flex: 1; overflow: hidden; }
      .si-avatar { width: 36px; height: 36px; font-size: 16px; flex-shrink: 0; }
      /* Compact action buttons on mobile — fixed width, no shrink */
      .si-actions {
        position: static !important;
        transform: none !important;
        flex-direction: row;
        background: none !important;
        border-left: none !important;
        padding: 0 !important;
        gap: 1px;
        flex-shrink: 0;
      }
      .btn-icon { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; }
      /* Drag handle hidden on mobile */
      .drag-handle { display: none; }

      /* ── Tab Bar ── */
      #mobile-tabs {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        /* screen-gap as padding-TOP: buttons sink to the bottom 48px (zone 1),
           glass background extends upward to fill the space above. */
        height: calc(48px + var(--screen-gap, env(safe-area-inset-bottom, 0px)));
        padding-top: var(--screen-gap, env(safe-area-inset-bottom, 0px));
        background: var(--glass);
        backdrop-filter: saturate(180%) blur(28px);
        -webkit-backdrop-filter: saturate(180%) blur(28px);
        border-top: 1px solid var(--stroke2);
        z-index: 350;
        align-items: flex-end;
      }
      .tab-btn {
        flex: 1;
        height: 48px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px;
        background: none; border: none; cursor: pointer;
        color: var(--text-muted);
        font-size: 10px; font-weight: 600; font-family: inherit;
        transition: color .15s;
        position: relative;
      }
      .tab-btn.active { color: var(--a2); }
      .tab-btn.active::after {
        content: '';
        position: absolute; top: 0; left: 25%; right: 25%;
        height: 2px; border-radius: 2px;
        background: var(--a2);
      }
      .tab-btn svg { width: 18px; height: 18px; }

      /* ── Hide kb-hints on mobile ── */
      #kb-hints { display: none !important; }
      /* ── Show mobile help button in header ── */
      #btn-mobile-help { display: flex; }

      /* ── Alias dialog full-width ── */
      #alias-dialog { width: calc(100vw - 32px); max-width: none; }

      /* ── Mobile Help Panel (lightweight popup, top-right) ── */
      #mobile-help-panel {
        position: fixed;
        top: 56px; /* below header */
        right: 14px;
        z-index: 9000;
        background: rgba(26,26,32,.94);
        border: 0.5px solid rgba(255,255,255,.15);
        border-radius: 14px;
        padding: 12px 16px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        min-width: 200px;
        display: flex; flex-direction: column; gap: 4px;
        white-space: nowrap;
        opacity: 0; pointer-events: none;
        transform: translateX(6px) translateY(-4px) scale(.98);
        transform-origin: top right;
        transition: opacity .18s ease, transform .18s ease;
        box-shadow: var(--shadow-md);
      }
      #mobile-help-panel.visible {
        opacity: 1; pointer-events: auto;
        transform: translateX(0) translateY(0) scale(1);
      }

      /* ── Toast: avoid tab-bar + player-bar ── */
      #toast-wrap { bottom: calc(48px + var(--screen-gap, env(safe-area-inset-bottom, 0px)) + 64px + 12px); right: 12px; }

      /* ── Add custom form full-width ── */
      #add-custom-form > div { padding: 10px; }

      /* ── Disable custom cursor ── */
      #cursor-dot, #cursor-ring { display: none !important; }
    }
    /* ── Touch optimization: remove hover effects on touch devices ── */
    @media (hover: none) {
      .station-item:hover { background: transparent; }
      .btn-icon:hover, .icon-btn:hover { background: transparent; opacity: 1; }
      .station-item:active { background: rgba(255,255,255,.12); }
      .btn-icon:active, .icon-btn:active { opacity: 0.7; }
      /* Bigger touch targets */
      .btn-icon { min-width: 36px; min-height: 36px; }
      .icon-btn { min-width: 36px; min-height: 36px; }
      .station-item { cursor: default; }
    }
    /* END MOBILE */

    audio { display: none; }

    /* ───── CUSTOM CURSOR ───── */
    /* Injected dynamically by applyTheme() into #cursor-style <style> tag */
    #cursor-dot, #cursor-ring { display: none; }
  </style>
</head>

<script>
/* ═══════════ THEMES (mesh background palettes) ═══════════ */
const APP_VERSION = 'v1.0.17';
const THEMES = [
  {
    id:'steel', label:'钢铁',
    a1:'#4f8ef7', a2:'#94b8ff', ag:'rgba(79,142,247,.28)',
    mesh: ['#18181e','#1a1e2a','#1c1e30','#181c28','#141418'],
    blobs: ['#1e3a5f','#2c4f8a','#3d6ab5','#1a2a45'],
    bg: '#18181e',
  },
  {
    id:'carbon', label:'碳黑',
    a1:'#9ca3af', a2:'#e5e7eb', ag:'rgba(156,163,175,.25)',
    mesh: ['#1a1a1c','#1e1e20','#222224','#1c1c1e','#181818'],
    blobs: ['#1f2937','#374151','#4b5563','#2a2a2a'],
    bg: '#1a1a1c',
  },
  {
    id:'copper', label:'紫铜',
    a1:'#b06030', a2:'#e8a878', ag:'rgba(176,96,48,.3)',
    mesh: ['#1e1610','#261a10','#2e2014','#241a12','#1a1410'],
    blobs: ['#7c3a10','#a85020','#c87040','#6b3010'],
    bg: '#1e1610',
  },
  {
    id:'tungsten', label:'钨紫',
    a1:'#c46dff', a2:'#e2aaff', ag:'rgba(196,109,255,.30)',
    mesh: ['#1a1420','#201428','#261430','#1e1226','#16101c'],
    blobs: ['#4a1472','#6e1ea0','#9430cc','#380e56'],
    bg: '#1a1420',
  },
];
let currentTheme = THEMES[0];

/* ═══════════ CANVAS BACKGROUND — WAVE SYSTEM ═══════════ */
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');

// Pure simulation — no audio hijacking (keeps sound working always)
let simT      = 0;
let energy    = 0;
let bassEnergy= 0;
let beatPulse = 0;
let prevBeat  = 0;

function tickSim() {
  const playing = state.status === 'playing' || state.status === 'loading';
  if (playing) {
    simT += 0.024;
    // Layered rhythms at different BPMs: ~72bpm slow, ~120bpm mid, ~180bpm fast
    const slow  = 0.5 + 0.5 * Math.sin(simT * 0.75);          // ~72bpm swell
    const mid   = 0.5 + 0.5 * Math.abs(Math.sin(simT * 2.09));// ~120bpm beat
    const fast  = 0.5 + 0.5 * Math.sin(simT * 4.71 + 0.8);   // ~180bpm hi-hat
    const sub   = 0.5 + 0.5 * Math.sin(simT * 0.39 + 1.6);   // slow swell

    energy     = slow * 0.3 + mid * 0.4 + fast * 0.15 + sub * 0.15;
    bassEnergy = mid  * 0.7 + slow * 0.3;

    // Beat detection on mid peak
    if (mid > 0.88 && prevBeat < 0.5) beatPulse = 1.0;
    prevBeat = mid;
    beatPulse *= 0.78;
  } else {
    simT += 0.004;
    energy     = energy     * 0.97 + 0.015 * (0.5 + 0.5 * Math.sin(simT * 0.4));
    bassEnergy = bassEnergy * 0.97 + 0.005;
    beatPulse  = 0;
  }
}

/* ── Offscreen canvas (reused) ── */
let offW = 0, offH = 0, offCanvas, offCtx, offBuf;
function ensureOff(w, h) {
  if (w !== offW || h !== offH) {
    offCanvas = document.createElement('canvas');
    offCanvas.width = w; offCanvas.height = h;
    offCtx = offCanvas.getContext('2d');
    offW = w; offH = h;
  }
}

/* ── Ripple pool ── */
const ripples = [];
let lastRippleMs = 0;

function spawnRipple() {
  const theme = currentTheme;
  // Pick one of the theme accent colors
  const palette = [theme.a1, theme.a2, ...theme.blobs.slice(0,2)];
  const color   = palette[Math.floor(Math.random() * palette.length)];
  const minSide = Math.min(canvas.width, canvas.height);

  // Varied origin: center cluster + random scatter
  const scatter = Math.random() < 0.4;
  const cx = scatter
    ? canvas.width  * Math.random()
    : canvas.width  * (0.25 + 0.5 * Math.random());
  const cy = scatter
    ? canvas.height * Math.random()
    : canvas.height * (0.25 + 0.5 * Math.random());

  // Size variety: small tight rings + big slow rings
  const big   = Math.random() < 0.3;
  const maxR  = minSide * (big ? (0.5 + 0.5 * Math.random()) : (0.12 + 0.25 * Math.random()));
  const speed = (big ? 1.2 : 2.5) + bassEnergy * 3 + beatPulse * 5;

  ripples.push({ x: cx, y: cy, r: 2, maxR, life: 1, color, speed, rings: big ? 3 : 2 });
}

/* ── Wave field ── */
let waveT = 0;

// 10 wave sources with varied spatial frequencies, speeds, angles
const WAVE_SOURCES = [
  { fx: 0.013, fy: 0.007, sp: 1.00, ph: 0.0 },
  { fx: 0.005, fy: 0.015, sp: 1.35, ph: 1.1 },
  { fx: 0.019, fy: 0.004, sp: 0.70, ph: 2.3 },
  { fx: 0.008, fy: 0.018, sp: 1.60, ph: 0.6 },
  { fx: 0.022, fy: 0.011, sp: 0.55, ph: 3.1 },
  { fx: 0.003, fy: 0.021, sp: 2.00, ph: 1.8 },
  { fx: 0.016, fy: 0.009, sp: 1.20, ph: 4.2 },
  { fx: 0.009, fy: 0.023, sp: 0.85, ph: 2.7 },
  // diagonal waves
  { fx: 0.011, fy: 0.011, sp: 1.45, ph: 0.4 },
  { fx: 0.017, fy: 0.017, sp: 0.65, ph: 3.8 },
];

function drawBg() {
  const W = canvas.width, H = canvas.height;
  const theme = currentTheme;
  const playing = state.status === 'playing' || state.status === 'loading';

  // ── 1. Base dark gradient ──
  const base = ctx.createLinearGradient(0, 0, W, H);
  const mc = theme.mesh;
  base.addColorStop(0,   mc[0]);
  base.addColorStop(.25, mc[1]);
  base.addColorStop(.5,  mc[2]);
  base.addColorStop(.75, mc[3]);
  base.addColorStop(1,   mc[4]);
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, W, H);

  // ── 2. Multi-source wave interference ──
  const RES = 5; // sample every N pixels (perf)
  const iw  = Math.ceil(W / RES);
  const ih  = Math.ceil(H / RES);
  ensureOff(iw, ih);

  const img = offCtx.createImageData(iw, ih);
  const buf = img.data;

  const c1  = hexRgb(theme.a1);
  const c2  = hexRgb(theme.a2);
  const c3  = hexRgb(theme.blobs[0] || theme.a1);

  // Wave speed: slow idle, energetic when playing + beat bursts
  const wSpd = playing ? (0.6 + energy * 2.8 + beatPulse * 4.5) : 0.08;
  waveT += wSpd * 0.016;

  // Compute each source's current phase (some modulated by energy)
  const phases = WAVE_SOURCES.map((s, i) => {
    let p = waveT * s.sp + s.ph;
    // Bass-modulated sources (alternate ones)
    if (i % 3 === 0) p += bassEnergy * 1.8;
    if (i % 4 === 0) p += beatPulse  * 2.2;
    return p;
  });

  const baseAlpha = playing ? (0.28 + energy * 0.28 + beatPulse * 0.18) : 0.08;

  for (let py = 0; py < ih; py++) {
    for (let px = 0; px < iw; px++) {
      const wx = px * RES, wy = py * RES;
      let v = 0;
      for (let si = 0; si < WAVE_SOURCES.length; si++) {
        const s = WAVE_SOURCES[si];
        v += Math.sin(wx * s.fx + wy * s.fy + phases[si]);
      }
      v /= WAVE_SOURCES.length; // -1 ~ 1

      // 3-way color blend based on wave value
      const t1 = Math.max(0, v);          // 0~1
      const t2 = Math.max(0, -v);         // 0~1 (opposite phase)
      const r = Math.round(c1[0]*t1 + c2[0]*t2 + c3[0]*(1-t1-t2)*0.3);
      const g = Math.round(c1[1]*t1 + c2[1]*t2 + c3[1]*(1-t1-t2)*0.3);
      const b = Math.round(c1[2]*t1 + c2[2]*t2 + c3[2]*(1-t1-t2)*0.3);
      const a = Math.min(255, Math.round(baseAlpha * Math.abs(v) * 255 * 1.8));

      const idx = (py * iw + px) * 4;
      buf[idx]=r; buf[idx+1]=g; buf[idx+2]=b; buf[idx+3]=a;
    }
  }
  offCtx.putImageData(img, 0, 0);
  ctx.drawImage(offCanvas, 0, 0, W, H);

  // ── 3. Expanding ripple rings ──
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r   += rp.speed + beatPulse * 3;
    rp.life = 1 - rp.r / rp.maxR;
    if (rp.life <= 0) { ripples.splice(i, 1); continue; }

    const ease = rp.life * rp.life; // quadratic fade

    // Draw multiple concentric echo rings per ripple
    for (let ri = 0; ri < rp.rings; ri++) {
      const echoR = rp.r * (1 - ri * 0.28);
      if (echoR < 1) continue;
      const a     = ease * (0.5 - ri * 0.12);
      const lw    = (3 - ri * 0.7) * ease;
      const hex   = Math.round(Math.max(0, a) * 255).toString(16).padStart(2,'0');
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, echoR, 0, Math.PI * 2);
      ctx.strokeStyle = rp.color + hex;
      ctx.lineWidth   = lw;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function animateBg() {
  tickSim();

  const now     = Date.now();
  const playing = state.status === 'playing' || state.status === 'loading';
  // On mobile, reduce bg animation to ~20fps to save battery
  const isMobileEnv = window.matchMedia && window.matchMedia('(max-width:480px)').matches;
  if (isMobileEnv) {
    // Only draw every ~50ms
    if (!animateBg._lastDraw || now - animateBg._lastDraw > 50) {
      animateBg._lastDraw = now;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBg();
    }
    requestAnimationFrame(animateBg);
    return;
  }

  // Adaptive spawn interval
  const baseInt = playing ? Math.max(60, 450 - energy * 280 - beatPulse * 180) : 4000;
  if (now - lastRippleMs > baseInt) {
    spawnRipple();
    if (beatPulse > 0.55) spawnRipple(); // beat: double
    if (beatPulse > 0.85) spawnRipple(); // strong beat: triple
    lastRippleMs = now;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBg();
  requestAnimationFrame(animateBg);
}

/* ═══════════ SPECTRUM VISUALIZER ═══════════ */
const specCanvas = document.getElementById('spectrum');
const specCtx    = specCanvas.getContext('2d');
const BAR_COUNT  = 32;
const barH       = new Float32Array(BAR_COUNT);
const barPhase   = Array.from({length: BAR_COUNT}, (_, i) => i * 0.38);
let   specRunning = false;

function drawSpectrum() {
  if (!specRunning) return;
  const W = specCanvas.offsetWidth  || 260;
  const H = specCanvas.offsetHeight || 48;
  if (specCanvas.width !== W)  specCanvas.width  = W;
  if (specCanvas.height !== H) specCanvas.height = H;
  specCtx.clearRect(0, 0, W, H);

  const barW = W / BAR_COUNT;
  const gap  = Math.max(1, barW * 0.2);
  const t    = simT;
  const col1 = currentTheme.a1;
  const col2 = currentTheme.a2;

  for (let i = 0; i < BAR_COUNT; i++) {
    const freq = 0.7 + (i / BAR_COUNT) * 3.8;
    const raw  = 0.12
      + 0.42 * Math.abs(Math.sin(t * freq + barPhase[i]))
      + 0.22 * Math.abs(Math.sin(t * freq * 1.8 + barPhase[i] * 0.6))
      + bassEnergy * 0.28 * Math.exp(-i / (BAR_COUNT * 0.45))
      + beatPulse  * 0.22;

    barH[i] += (Math.min(raw, 1) - barH[i]) * 0.25;
    const bh = barH[i] * H * 0.9;
    const x  = i * barW + gap / 2;
    const w  = Math.max(barW - gap, 1);

    const grad = specCtx.createLinearGradient(0, H, 0, H - bh);
    grad.addColorStop(0,   col1 + 'dd');
    grad.addColorStop(0.6, col2 + '99');
    grad.addColorStop(1,   col2 + '33');
    specCtx.fillStyle = grad;
    specCtx.beginPath();
    specCtx.roundRect(x, H - bh, w, bh, [3, 3, 0, 0]);
    specCtx.fill();
  }
  requestAnimationFrame(drawSpectrum);
}

function addFav(s) {
  if (isFav(s.stationuuid)) return;
  // Insert after all pinned items
  const firstUnpinned = state.favorites.findIndex(f => !f.pinned);
  const item = pick(s);
  if (firstUnpinned === -1) {
    state.favorites.push(item);
  } else {
    state.favorites.splice(firstUnpinned, 0, item);
  }
  saveFavorites(); renderFavs(); syncFavBtns();
  toast('已收藏 ' + s.name);

  requestAnimationFrame(() => {

    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

function removeFav(uuid) {

  const name = state.favorites[i].name;
  state.favorites.splice(i, 1);

function playStation(s) {
  state.current = s;
  saveLastStation(s);
  audio.src = s.url_resolved || s.url;
  audio.volume = getVol();
  setStatus('loading');
  updateBar();
  // Do NOT call audio.load() before play() on iOS — it breaks the user gesture chain
  const p = audio.play();
  if (p && p.catch) p.catch(() => setStatus('error'));
}

let _toggleCooldown = false;
function togglePlay() {
  if (_toggleCooldown) return;
  _toggleCooldown = true;
  setTimeout(() => { _toggleCooldown = false; }, 200);

  if (!state.current) { toast('请先选择一个电台'); return; }
  // Error state or no src → retry / load
  if (state.status === 'error' || !audio.src || audio.src === window.location.href) {
    playStation(state.current);
    return;
  }
  if (audio.paused) {
    const p = audio.play();
    if (p && p.catch) p.catch(() => {
      // Play failed (e.g. network) → retry full reload
      playStation(state.current);
    });
  } else {
    audio.pause();
  }
}

audio.addEventListener('playing', () => setStatus('playing'));
audio.addEventListener('pause',   () => setStatus('paused'));
audio.addEventListener('waiting', () => {
  // Only flip to loading during initial connect (not during playback buffering)
  if (state.status === 'loading' || state.status === 'idle' || state.status === 'error') {
    setStatus('loading');
  }
});
audio.addEventListener('stalled', () => { /* ignore — fires constantly on live streams */ });
audio.addEventListener('error',   () => setStatus('error'));
audio.addEventListener('canplay', () => { if (!audio.paused) setStatus('playing'); });

// PWA icon data URL for Media Session artwork
const _pwaIconHref = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href || '';

// Cache favicon as normalized 512x512 PNG data URL to improve lock-screen adoption
const _faviconCache = {};
async function fetchFaviconAsDataURL(url) {
  if (!url) return null;
  if (_faviconCache[url]) return _faviconCache[url];
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const loaded = await new Promise((resolve, reject) => {
      img.onload = () => resolve(true);
      img.onerror = reject;
      img.src = url;
    });
    if (!loaded) return null;

    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    if (!ctx) return null;

    // Dark background for non-square / transparent favicons
    ctx.fillStyle = '#111118';
    ctx.fillRect(0, 0, size, size);

    const iw = img.naturalWidth || size;
    const ih = img.naturalHeight || size;
    const scale = Math.min((size * 0.78) / iw, (size * 0.78) / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = (size - dw) / 2;
    const dy = (size - dh) / 2;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, dx, dy, dw, dh);

    const dataUrl = canvas.toDataURL('image/png');
    _faviconCache[url] = dataUrl;
    return dataUrl;
  } catch {
    return null;
  }
}

function updateBar() {
  const s = state.current; if (!s) return;
  // Update inner span for marquee support
  const nameSpan = nowName.querySelector('span') || nowName;
  nameSpan.textContent = s.alias || s.name;
  // Re-bind marquee (hoverTarget = .station-info container)
  const stationInfo = nowName.closest('.station-info') || nowName.parentElement;
  initMarqueeOn(nameSpan, stationInfo);
  avatarEl.innerHTML = s.favicon
    ? `<img src="${esc(s.favicon)}" onerror="this.parentNode.innerHTML='<span>📻</span>'" />`
    : '<span>📻</span>';
  // sync fav button state
  const isFav = state.favorites.some(f => f.stationuuid === s.stationuuid);
  btnFavCur.textContent = isFav ? '★' : '☆';
  btnFavCur.classList.toggle('active', isFav);
  // Media Session — controls lock screen artwork
  if ('mediaSession' in navigator) {
    // Set metadata immediately with PWA icon, then upgrade to favicon if available
    const setMediaMeta = (artworkSrc) => {
      const artwork = [];
      if (artworkSrc) artwork.push({ src: artworkSrc, sizes: '512x512', type: 'image/png' });
      if (_pwaIconHref) artwork.push({ src: _pwaIconHref, sizes: '512x512', type: 'image/png' });
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.alias || s.name,
        artist: s.country || s.tags || 'WebRadio',
        album: 'WebRadio',
        artwork
      });
    };
    // Start with PWA icon immediately
    setMediaMeta(null);
    // Try to fetch favicon as base64 and upgrade
    if (s.favicon) {
      fetchFaviconAsDataURL(s.favicon).then(dataUrl => {
        // Only update if still the same station
        if (state.current && state.current.stationuuid === s.stationuuid && dataUrl) {
          setMediaMeta(dataUrl);
        }
      });
    }
    navigator.mediaSession.setActionHandler('play', () => {
      // If audio has stalled/errored, do a full reload; otherwise just resume
      if (audio.paused && (audio.readyState < 2 || state.status === 'error')) {
        playStation(state.current);
      } else {
        audio.play().catch(() => playStation(state.current));
      }
    });
    navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
    navigator.mediaSession.setActionHandler('stop',  () => { audio.pause(); });
  }
}

// Space bar: toggle play/pause (skip if focus is in input)
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowUp' || e.code === 'ArrowDown') {
    e.preventDefault();
    const favs = state.favorites;
    if (!favs.length) { toast('收藏列表为空'); return; }
    const cur = favs.findIndex(s => state.current && s.stationuuid === state.current.stationuuid);
    let next;
    if (e.code === 'ArrowUp') {
      next = cur <= 0 ? favs.length - 1 : cur - 1;
    } else {
      next = cur < 0 || cur >= favs.length - 1 ? 0 : cur + 1;
    }
    playStation(favs[next]);
    refreshBadges();
    // Scroll the item into view in fav-list
    const el = favList.querySelector(`[data-uuid="${favs[next].stationuuid}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
});

const volSlider = document.getElementById('volume');
const volIcon   = document.getElementById('vol-icon');

/* ═══════════ API ═══════════ */
const HOSTS = [
  'https://de1.api.radio-browser.info',
  'https://nl1.api.radio-browser.info',
  'https://at1.api.radio-browser.info',
];

async function apiFetch(path) {
  for (const h of HOSTS) {
    try {
      const r = await fetch(h + path, { headers:{'User-Agent':'WebRadio/3.0'} });
      if (!r.ok) continue;
      return r.json();
    } catch(e) { continue; }
  }
  throw new Error('所有 API 节点不可用');
}

async function fetchTop() {
  return apiFetch('/json/stations?' + new URLSearchParams({ limit:40, order:'clickcount', reverse:'true', hidebroken:'true' }));
}
async function searchAPI(q) {
  return apiFetch('/json/stations/search?' + new URLSearchParams({ name:q, limit:40, order:'clickcount', reverse:'true', hidebroken:'true' }));
}

/* ═══════════ SEARCH ═══════════ */
let dbt;
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', e => {
  clearTimeout(dbt);
  const q = e.target.value.trim();
  if (!q) {
    setTitle('热门频道');
    loadTop();
    return;
  }
  dbt = setTimeout(() => {
    doSearch(q);
  }, 380);
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(dbt);
    const q = e.target.value.trim();
    e.target.blur();
    if (!q) {
      loadTop();
      return;
    }
    doSearch(q);
  }
});

async function doSearch(q) {
  setTitle('搜索结果'); showLoading('正在搜索…');
  try { renderResults(await searchAPI(q)); } catch(e) { showError(e.message); }
}
async function loadTop() {
  setTitle('热门频道'); showLoading('正在加载热门频道…');
  try { renderResults(await fetchTop()); } catch(e) { showError(e.message); }
}

function bindEvents(container, isFavContainer) {
  container.querySelectorAll('.station-item').forEach(el => {
    el.addEventListener('click', () => {
      const s = isFavContainer
        ? state.favorites.find(f => f.stationuuid === el.dataset.uuid)
        : (cache[el.dataset.uuid] || state.favorites.find(f => f.stationuuid === el.dataset.uuid));
      if (s) {
        // Ignore if already playing this station
        const isPlaying = state.current && state.current.stationuuid === s.stationuuid && state.status === 'playing';
        if (isPlaying) return;
        playStation(s); refreshBadges();
      }
    });
  });
  container.querySelectorAll('[data-action="fav"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const uuid = btn.dataset.uuid;
      isFav(uuid) ? removeFav(uuid) : addFav(cache[uuid] || state.favorites.find(f => f.stationuuid === uuid));
    });
  });
  container.querySelectorAll('[data-action="del"]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); removeFav(btn.dataset.uuid); });
  });
  container.querySelectorAll('[data-action="top"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const uuid = btn.dataset.uuid;
      const idx = state.favorites.findIndex(f => f.stationuuid === uuid);
      if (idx < 0) return;
      const item = state.favorites[idx];
      if (item.pinned) {
        // Unpin: move to head of unpinned section
        item.pinned = false;
        state.favorites.splice(idx, 1);
        const firstUnpinned = state.favorites.findIndex(f => !f.pinned);
        if (firstUnpinned === -1) state.favorites.push(item);
        else state.favorites.splice(firstUnpinned, 0, item);
        toast('已取消置顶');
      } else {
        // Pin: move to top
        item.pinned = true;
        state.favorites.splice(idx, 1);
        state.favorites.unshift(item);
        toast('已置顶');
      }
      saveFavorites();
      renderFavs();
    });
  });
  container.querySelectorAll('[data-action="alias"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const uuid = btn.dataset.uuid;
      const fav  = state.favorites.find(f => f.stationuuid === uuid);
      if (!fav) return;
      showAliasDialog(fav);
    });
  });
  requestAnimationFrame(() => {
    container.querySelectorAll('.si-name > span:first-child').forEach(span => {
      initMarquee(span);
    });
  });
}

const favList  = document.getElementById('fav-list');
const favCount = document.getElementById('fav-count');

function renderFavs() {
  favCount.textContent = state.favorites.length;
  if (!state.favorites.length) {
    favList.innerHTML = `<div class="empty-state"><span class="e-icon">⭐</span>点击电台旁的 ☆ 添加收藏<br/>数据保存在本地</div>`;
    return;
  }
  const pinned   = state.favorites.filter(f => f.pinned);
  const unpinned = state.favorites.filter(f => !f.pinned);
  if (pinned.length && unpinned.length) {
    // Mark last pinned for CSS divider
    html = pinned.map((s, i) => favHtml(s, i === pinned.length - 1)).join('');
    html += unpinned.map(s => favHtml(s, false)).join('');
  } else {
    html = state.favorites.map(s => favHtml(s, false)).join('');
  }  favList.innerHTML = html;
  bindEvents(favList, true);
  bindDragSort();
}

let _dragSrc  = null;
let _aliasFav = null;

function showAliasDialog(fav) {
  _aliasFav = fav;
  const sub = document.getElementById('alias-sub');
  if (sub) sub.textContent = fav.name;
  const inp = document.getElementById('alias-input');
  if (inp) inp.value = fav.alias || '';
  const ov = document.getElementById('alias-overlay');
  if (ov) ov.style.display = 'flex';
  requestAnimationFrame(() => { if (inp) { inp.focus(); inp.select(); } });
}
function closeAliasDialog() {
  const ov = document.getElementById('alias-overlay');
  if (ov) ov.style.display = 'none';
  _aliasFav = null;
}
function commitAlias() {
  if (!_aliasFav) { console.warn('[alias] _aliasFav is null'); return; }
  const inp = document.getElementById('alias-input');
  const newAlias = inp ? inp.value.trim() : '';
  const uuid = _aliasFav.stationuuid;
  console.log('[alias] uuid:', uuid, 'newAlias:', newAlias, 'favorites count:', state.favorites.length);
  const favInArr = state.favorites.find(f => f.stationuuid === uuid);
  console.log('[alias] favInArr:', favInArr);
  if (!favInArr) { toast('找不到该电台'); closeAliasDialog(); return; }
  favInArr.alias = newAlias;
  saveFavorites();
  renderFavs();
  if (state.current && state.current.stationuuid === uuid) {
    state.current.alias = newAlias;
    updateBar();
  }
  toast(newAlias ? `备注已设为「${newAlias}」` : '已清除备注');
  closeAliasDialog();
}
function bindDragSort() {
  favList.querySelectorAll('.station-item[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => {
      _dragSrc = el;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      favList.querySelectorAll('.station-item').forEach(i => i.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (el !== _dragSrc) {
        favList.querySelectorAll('.station-item').forEach(i => i.classList.remove('drag-over'));
        el.classList.add('drag-over');
      }
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (!_dragSrc || _dragSrc === el) return;
      const fromUuid = _dragSrc.dataset.uuid;
      const toUuid   = el.dataset.uuid;
      const fromIdx  = state.favorites.findIndex(s => s.stationuuid === fromUuid);
      const toIdx    = state.favorites.findIndex(s => s.stationuuid === toUuid);
      if (fromIdx < 0 || toIdx < 0) return;
      const [item] = state.favorites.splice(fromIdx, 1);
      state.favorites.splice(toIdx, 0, item);
      saveFavorites();
      renderFavs();
    });
  });
}

function syncFavBtns() {
  resultsList.querySelectorAll('[data-action="fav"]').forEach(btn => {
    const f = isFav(btn.dataset.uuid);
    btn.textContent = f ? '★' : '☆';
    btn.title = f ? '取消' : '收藏';
    btn.classList.toggle('fav', f);

}

function refreshBadges() {
  [resultsList, favList].forEach(c => {
    c.querySelectorAll('.station-item').forEach(el => {
      const isNow = state.current && state.current.stationuuid === el.dataset.uuid;
      el.classList.toggle('now-playing', isNow);
      const dot  = el.querySelector('.now-dot');
      const name = el.querySelector('.si-name');
      if (isNow && !dot) name.insertAdjacentHTML('beforeend', '<span class="now-dot"><span></span></span>');
      else if (!isNow && dot) dot.remove();
    });
  });
}

/* ═══════════ MARQUEE UTIL ═══════════
   Hover → scroll to end → instant reset → repeat
   Leave → instant reset, no animation
═══════════════════════════════════════ */
function initMarqueeOn(span, hoverTarget) {
  // Remove previous listeners if any
  if (span._marqueeCleanup) span._marqueeCleanup();

  let raf = null;
  let pos = 0;
  let running = false;

  function reset() {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    pos = 0;
    span.style.transform = 'translateX(0)';
    span.style.overflow = '';
    span.classList.remove('marquee-active');
  }

  function start() {
    // Temporarily remove overflow:hidden to measure real scrollWidth
    span.style.overflow = 'visible';
    const overflow = span.scrollWidth - span.parentElement.clientWidth;
    if (overflow <= 4) { span.style.overflow = ''; return; }
    const dist    = overflow + 12;
    const speed   = 40;        // px/sec
    const pauseMs = 800;
    span.classList.add('marquee-active');
    running = true;
    pos = 0;
    let lastT = null;
    let phase = 'pause-start';
    let phaseT = 0;

    function tick(t) {
      if (!running) return;
      const dt = lastT ? (t - lastT) : 0;
      lastT = t;
      if (phase === 'pause-start') {
        phaseT += dt;
        if (phaseT >= pauseMs) { phase = 'scroll'; phaseT = 0; }
      } else if (phase === 'scroll') {
        pos += speed * dt / 1000;
        if (pos >= dist) { pos = dist; phase = 'pause-end'; phaseT = 0; }
        span.style.transform = `translateX(-${pos}px)`;
      } else if (phase === 'pause-end') {
        phaseT += dt;
        if (phaseT >= pauseMs) {
          pos = 0;
          span.style.transform = 'translateX(0)';
          phase = 'pause-start';
          phaseT = 0;
        }
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
  }

  hoverTarget.addEventListener('mouseenter', start);
  hoverTarget.addEventListener('mouseleave', reset);
  span._marqueeCleanup = () => {
    hoverTarget.removeEventListener('mouseenter', start);
    hoverTarget.removeEventListener('mouseleave', reset);
    reset();
  };
}

// Convenience: use closest .station-item as hover target
function initMarquee(span) {
  const item = span.closest('.station-item');
  if (item) initMarqueeOn(span, item);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function initThemes() {
  const ctr = document.getElementById('theme-swatches');
  ctr.innerHTML = THEMES.map(t =>
    `<button class="swatch" data-theme="${t.id}"
      style="background:linear-gradient(135deg,${t.a1},${t.a2})"
      title="${t.label}"></button>`
  ).join('');
  ctr.querySelectorAll('.swatch').forEach(btn => {
    btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
  });
  const saved = loadTheme();
  applyTheme(saved && THEMES.find(x => x.id === saved) ? saved : 'steel');
}

/* ═══════════ INIT ═══════════ */
(function init() {
  loadFavorites();
  renderFavs();
  initThemes();
  animateBg();
  // Restore last played → fallback to first favorite → fallback to nothing
  const lastS = loadLastStation();
  const preselect = lastS || (state.favorites.length ? state.favorites[0] : null);
  if (preselect) {
    state.current = preselect;
    updateBar();
    setStatus('idle');
  }
  /* ── Alias dialog ── */
  const aliasOverlay = document.getElementById('alias-overlay');
  const aliasInput   = document.getElementById('alias-input');
  const aliasSub     = document.getElementById('alias-sub');
  document.getElementById('alias-confirm').addEventListener('click', commitAlias);
  document.getElementById('alias-cancel').addEventListener('click', closeAliasDialog);
  aliasOverlay.addEventListener('click', e => { if (e.target === aliasOverlay) closeAliasDialog(); });
  aliasInput.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); commitAlias(); }
    if (e.key === 'Escape') closeAliasDialog();
  });

  loadTop();

  /* ── Manual add custom station ── */
  const addForm      = document.getElementById('add-custom-form');
  const customName   = document.getElementById('custom-name');
  const customUrl    = document.getElementById('custom-url');
  document.getElementById('btn-add-custom').addEventListener('click', () => {
    const open = addForm.style.display === 'none';
    addForm.style.display = open ? 'block' : 'none';
    if (open) customName.focus();
  });
  document.getElementById('btn-custom-cancel').addEventListener('click', () => {
    addForm.style.display = 'none';
    customName.value = ''; customUrl.value = '';
  });
  document.getElementById('btn-custom-save').addEventListener('click', () => {
    const name = customName.value.trim();
    const url  = customUrl.value.trim();
    if (!name) { toast('请输入电台名称'); customName.focus(); return; }
    if (!url || !/^https?:\/\//i.test(url)) { toast('请输入有效的直播流地址'); customUrl.focus(); return; }
    const id = 'custom_' + Date.now();
    const item = { stationuuid: id, name, url_resolved: url, url, favicon: '', country: '', tags: '', bitrate: 0, frequency: '', pinned: false };
    const firstUnpinned = state.favorites.findIndex(f => !f.pinned);
    if (firstUnpinned === -1) state.favorites.push(item);
    else state.favorites.splice(firstUnpinned, 0, item);
    saveFavorites(); renderFavs(); syncFavBtns();
    toast('已添加 ' + name);
    addForm.style.display = 'none';
    customName.value = ''; customUrl.value = '';
    requestAnimationFrame(() => {
      const el = favList.querySelector(`[data-uuid="${id}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
  // Enter to save
  [customName, customUrl].forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-custom-save').click();
  }));
})();

(function() {
