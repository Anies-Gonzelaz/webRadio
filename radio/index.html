  const ring = document.getElementById('cursor-ring');
  let rx = 0, ry = 0;  // ring position (lagged)
  let mx = 0, my = 0;  // mouse position

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + 'px';
    dot.style.top  = my + 'px';
  });

  // Ring smoothly follows with lag
  function animRing() {
    rx += (mx - rx) * 0.18;
    ry += (my - ry) * 0.18;
    ring.style.left = rx + 'px';
    ring.style.top  = ry + 'px';
    requestAnimationFrame(animRing);
  }
  animRing();

  document.addEventListener('mousedown', () => {
    dot.classList.add('clicking');
    ring.classList.add('clicking');
  });
  document.addEventListener('mouseup', () => {
    dot.classList.remove('clicking');
    ring.classList.remove('clicking');
  });

  // Expand ring on interactive elements
  const hoverSel = 'a,button,input,select,[role="button"],[draggable],.station-item,.swatch';
  document.addEventListener('mouseover', e => {
    if (e.target.closest(hoverSel)) ring.classList.add('hovering');
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest(hoverSel)) ring.classList.remove('hovering');
  });

  // Hide when mouse leaves window
  document.addEventListener('mouseleave', () => { dot.style.opacity = '0'; ring.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { dot.style.opacity = ''; ring.style.opacity = ''; });
})();

/* ═══════════ MOBILE ADAPTATION ═══════════ */
(function initMobile() {
  const isMobile = () => window.matchMedia('(max-width: 600px)').matches;

  /* ── 1. Tab Bar visibility & switching ── */
  const tabNav   = document.getElementById('mobile-tabs');
  const paneMap  = { fav: 'pane-fav', search: 'pane-search' };
  let activeTab  = 'fav';

  function showTabBar() { if (tabNav) tabNav.style.display = 'flex'; }
  function hideTabBar() { if (tabNav) tabNav.style.display = 'none'; }

  window.switchTab = function(name) {
    if (!paneMap[name]) return;
    activeTab = name;
    Object.keys(paneMap).forEach(k => {
      const pane = document.getElementById(paneMap[k]);
      const btn  = document.getElementById('tab-' + k);
      if (pane) pane.classList.toggle('hidden', k !== name);
      if (btn)  btn.classList.toggle('active', k === name);
    });
  };

  /* ── 2. Volume popover ── */
  const volPopover  = document.getElementById('vol-popover');
  const volSliderV  = document.getElementById('vol-slider-v');
  const volIcon     = document.getElementById('vol-icon');
  const volSlider   = document.getElementById('volume'); // desktop slider

  // Sync vertical slider ↔ desktop slider
  if (volSlider && volSliderV) {
    volSliderV.value = volSlider.value;
    volSlider.addEventListener('input', () => { volSliderV.value = volSlider.value; });
    volSliderV.addEventListener('input', () => {
      volSlider.value = volSliderV.value;
      volSlider.dispatchEvent(new Event('input'));
    });
  }

  let volOpen = false;
  function openVolPopover()  { volOpen = true;  if (volPopover) volPopover.classList.remove('hidden'); }
  function closeVolPopover() { volOpen = false; if (volPopover) volPopover.classList.add('hidden'); }

  if (volIcon) {
    volIcon.addEventListener('click', e => {
      if (!isMobile()) return;
      e.stopPropagation();
      volOpen ? closeVolPopover() : openVolPopover();
    });
  }
  document.addEventListener('click', e => {
    if (!isMobile() || !volOpen) return;
    if (volPopover && !volPopover.contains(e.target)) closeVolPopover();
  });

  /* ── 3. Swipe-to-reveal on fav list ── */
  const FAV_LIST = document.getElementById('fav-list');
  let swipedEl = null;

  function closeSwiped() {
    if (swipedEl) { swipedEl.classList.remove('swiped'); swipedEl = null; }
  }

  // Delegate touch events on fav-list
  if (FAV_LIST) {
    let startX = 0, startY = 0, startScrollTop = 0, tracking = false, moved = false;

    FAV_LIST.addEventListener('touchstart', e => {
      const item = e.target.closest('.station-item');
      if (!item || !isMobile()) return;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      startScrollTop = FAV_LIST.scrollTop;
      tracking = true; moved = false;
    }, { passive: true });

    FAV_LIST.addEventListener('touchmove', e => {
      if (!tracking || !isMobile()) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      // If mostly vertical, let scroll happen
      if (Math.abs(dy) > Math.abs(dx) + 8) { tracking = false; return; }
      moved = true;
    }, { passive: true });

    FAV_LIST.addEventListener('touchend', e => {
      if (!tracking || !isMobile()) { tracking = false; return; }
      const item = e.changedTouches[0];
      const dx = item.clientX - startX;
      const itemEl = e.target.closest('.station-item');
      if (!moved || !itemEl) { tracking = false; return; }

      if (dx < -40) {
        // Swipe left → reveal
        closeSwiped();
        itemEl.classList.add('swiped');
        swipedEl = itemEl;
      } else if (dx > 40) {
        // Swipe right → close
        closeSwiped();
      }
      tracking = false;
    }, { passive: true });

    // Tap elsewhere to close swipe
    FAV_LIST.addEventListener('click', e => {
      if (!isMobile()) return;
      const item = e.target.closest('.station-item');
      if (swipedEl && item !== swipedEl) { closeSwiped(); }
    });
  }

  /* ── 4. Responsive init / resize ── */
  function onResize() {
    if (isMobile()) {
      showTabBar();
      // Ensure active pane is shown
      switchTab(activeTab);
      closeVolPopover();
    } else {
      hideTabBar();
      // Restore both panes
      ['pane-fav', 'pane-search'].forEach(id => {
        const p = document.getElementById(id);
        if (p) p.classList.remove('hidden');
      });
      // Constrain kb-panel width to not overlap the aside (left column)
      const aside = document.querySelector('aside');
      const panel = document.getElementById('kb-panel');
      if (aside && panel) {
        const asideRect = aside.getBoundingClientRect();
        // panel starts at left:24px, keep 12px gap before aside right edge
        const maxW = Math.max(160, asideRect.right - 24 - 12);
        panel.style.maxWidth = maxW + 'px';
      }
    }
  }

  window.addEventListener('resize', onResize);
  onResize(); // run once on load
})();

/* ═══════════ KB-PANEL hover fix (bridge gap between trigger and panel) ═══════════ */
(function() {
  const hints   = document.getElementById('kb-hints');
  const panel   = document.getElementById('kb-panel');
  let hideTimer = null;

  function showPanel()   { clearTimeout(hideTimer); panel.classList.add('visible'); }
  function scheduleHide(){ hideTimer = setTimeout(() => panel.classList.remove('visible'), 120); }

  hints.addEventListener('mouseenter', showPanel);
  hints.addEventListener('mouseleave', scheduleHide);
  panel.addEventListener('mouseenter', showPanel);
  panel.addEventListener('mouseleave', scheduleHide);
})();

/* ═══════════ MOBILE HELP PANEL ═══════════ */
function toggleMobileHelp() {
  const panel   = document.getElementById('mobile-help-panel');
  const btnHelp = document.getElementById('btn-mobile-help');
  const isOpen  = panel.classList.contains('visible');
  panel.classList.toggle('visible', !isOpen);
  if (btnHelp) btnHelp.style.color = isOpen ? '' : 'var(--a2)';
}
// Close when clicking outside
document.addEventListener('click', function(e) {
  const panel = document.getElementById('mobile-help-panel');
  const btn   = document.getElementById('btn-mobile-help');
  if (panel && panel.classList.contains('visible') &&
      !panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
    panel.classList.remove('visible');
    if (btn) btn.style.color = '';
  }
});

// Render version labels from a single source of truth
Array.from(document.querySelectorAll('[data-version-slot]')).forEach(el => {
  el.textContent = APP_VERSION;
});

/* ═══════════ iOS PWA SCREEN GAP FIX ═══════════
 * In iOS PWA (standalone) mode, position:fixed bottom:0 stops at
 * window.innerHeight, NOT the physical screen bottom (screen.height).
 * The difference (--screen-gap) is used to extend the tab bar background
 * so it covers the home indicator zone with no visible gap.
 * In regular Safari, screen.height ≈ window.innerHeight so gap ≈ 0.
 * ════════════════════════════════════════════ */
(function() {
  var isMobile = window.matchMedia('(max-width: 600px)').matches;

  function setMetrics() {
    // Measure actual gap: how much screen is below the layout viewport
    var gap = Math.max(0, screen.height - window.innerHeight);
    // Sanity check: desktop browsers often report screen.height in physical px,
    // making gap unreasonably large (>200). Clamp to 0 in that case.
    if (gap > 200) gap = 0;

    document.documentElement.style.setProperty('--screen-gap', gap + 'px');

    // --app-vh: only override on mobile; desktop uses the CSS default (100dvh)
    if (isMobile) {
      document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
    }
  }

  setMetrics();
  requestAnimationFrame(setMetrics);
  setTimeout(setMetrics, 60);
  setTimeout(setMetrics, 300);
  setTimeout(setMetrics, 600);

  window.addEventListener('resize', function() {
    isMobile = window.matchMedia('(max-width: 600px)').matches;
    setMetrics();
  });
  window.addEventListener('orientationchange', function() {
    setTimeout(setMetrics, 100);
    setTimeout(setMetrics, 300);
  });
  window.addEventListener('pageshow', setMetrics);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) setMetrics();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setMetrics);
  }
})();
</script>
